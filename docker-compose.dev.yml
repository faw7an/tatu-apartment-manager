# Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Or simpler — just run the DB in Docker and run the API locally:
#   docker compose -f docker-compose.dev.yml up -d db
#   npm run dev

services:

  api:
    # In dev: run from source with hot reload instead of compiled build
    command: npm run dev
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src        # mount source so hot reload works
    ports:
      - "3000:3000"           # expose API directly (no nginx in dev)
      - "51212:51212"
    environment:
      NODE_ENV: development

  db:
    ports:
      - "5432:5432"           # expose DB port so you can use Prisma Studio
                              # and TablePlus/DBeaver from your local machine
                              # DO NOT expose this in production compose

  # Disable nginx and certbot in dev — not needed
  nginx:
    profiles:
      - production            # only starts when --profile production is used

  certbot:
    profiles:
      - production
